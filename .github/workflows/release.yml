name: Release

# Builds the Windows installer and attaches it to a draft GitHub Release.
# Trigger it by pushing a version tag (git tag v0.1.0 && git push --tags)
# or by running it manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NOIR ${{ github.ref_name }}
          releaseBody: Download the setup .exe below and run it. NOIR installs for your user account; no admin rights needed.
          releaseDraft: true
          prerelease: false
